name: HealCode Environment Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install HealCode
        run: |
          python -m pip install --upgrade pip
          pip install healcode

      - name: Run Diagnostics Scan
        run: |
          healcode scan --json > healcode-report.json

      - name: Upload Scan Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: healcode-report
          path: healcode-report.json
