[project]
name = "healcode"
version = "1.0.0"
description = "AI-powered developer diagnostics CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "HealCode Maintainers" }
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
healcode = "healcode.cli.entrypoint:main"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["healcode*"]
